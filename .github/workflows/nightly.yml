name: nightly-data
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST, weekdays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m engine.run
      - name: Commit data
        run: |
          git config user.name "data-bot" && git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "nightly data" && git push)
